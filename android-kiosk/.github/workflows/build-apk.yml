name: Build APK Kiosk SMPN 1 Pandan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Kiosk (Release & Debug)
        run: gradle assembleDebug assembleRelease

      - name: Upload File APK Siap Instal
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-Kiosk-SMPN1-Pandan-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
